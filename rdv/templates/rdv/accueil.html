<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des rendez-vous médicaux</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #e3f2fd, #ffffff);
        }
        .card{
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .card:hover{
            transform: scale(1.05);
        }
        .main-title{
            margin-top: 60px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container text-center">

    <h1 class="main-title">Bienvenue sur la plateforme de gestion de rendez-vous</h1>
    <p class="mb-5">Choisissez votre espace pour continuer</p>

    <div class="row justify-content-center">

        <!-- Carte Patient -->
        <div class="col-md-4">
            <div class="card p-4">
                <h3>Espace Patient</h3>
                <p>Prendre un rendez-vous rapidement avec un médecin</p>
                <a href="/rendezvous/" class="btn btn-primary btn-lg">Accéder</a>
            </div>
        </div>

        <!-- Carte Admin -->
        <div class="col-md-4">
            <div class="card p-4">
                <h3>Espace Administration</h3>
                <p>Gérer les médecins, hôpitaux et rendez-vous</p>
                <a href="/admin/" class="btn btn-dark btn-lg">Accéder</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
