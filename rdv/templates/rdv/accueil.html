<!DOCTYPE html>
<html>
<head>
    <title>Gestion des Rendez-vous</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container text-center mt-5">

    <h1 class="mb-4">Bienvenue sur la plateforme de gestion des rendez-vous médicaux</h1>
    <p class="mb-5">Choisissez votre espace</p>

    <div class="row justify-content-center">

        <!-- COTE PATIENT -->
        <div class="col-md-4">
            <div class="card shadow p-4">
                <h3>Espace Patient</h3>
                <p>Prendre un rendez-vous avec un médecin en quelques clics.</p>
                <a href="/prendre-rdv/" class="btn btn-primary btn-lg">Côté Patient</a>
            </div>
        </div>

        <!-- COTE ADMIN -->
        <div class="col-md-4">
            <div class="card shadow p-4">
                <h3>Espace Administrateur</h3>
                <p>Gérer les rendez-vous, médecins et hôpitaux.</p>
                <a href="/login/" class="btn btn-dark btn-lg">Côté Admin</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
